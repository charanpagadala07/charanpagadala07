<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" role="img" aria-label="Most used languages">
<style>
:root{--bg:#0d1117;--border:#30363d;--fg:#e6edf3;--muted:#8b949e;--track:#21262d;--accent:#58a6ff}
@media (prefers-color-scheme: light){:root{--bg:#ffffff;--border:#d0d7de;--fg:#1f2328;--muted:#656d76;--track:#eaeef2;--accent:#0969da}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.title{font-size:15px;font-weight:600;fill:var(--fg)}
.label{font-size:11px;fill:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.value{font-size:24px;font-weight:600;fill:var(--fg)}
.lang{font-size:12px;fill:var(--fg)}
.pct{font-size:12px;fill:var(--muted)}
.sub{font-size:11px;fill:var(--muted)}
</style>
<rect x=".5" y=".5" width="494" height="214" rx="10" fill="var(--bg)" stroke="var(--border)"/>
<text class="title" x="28" y="36">Languages</text>
<text class="sub" x="467" y="36" text-anchor="end">by code size</text>
<line x1="28" y1="48" x2="467" y2="48" stroke="var(--border)"/>
<circle cx="105" cy="128" r="50" fill="none" stroke="var(--track)" stroke-width="20"/>
<circle cx="105" cy="128" r="50" fill="none" stroke="#f1e05a" stroke-width="20" stroke-dasharray="126.32 314.16" stroke-dashoffset="-0.00" transform="rotate(-90 105 128)"/><circle cx="105" cy="128" r="50" fill="none" stroke="#b07219" stroke-width="20" stroke-dasharray="67.44 314.16" stroke-dashoffset="-127.82" transform="rotate(-90 105 128)"/><circle cx="105" cy="128" r="50" fill="none" stroke="#3178c6" stroke-width="20" stroke-dasharray="47.00 314.16" stroke-dashoffset="-196.75" transform="rotate(-90 105 128)"/><circle cx="105" cy="128" r="50" fill="none" stroke="#4F5D95" stroke-width="20" stroke-dasharray="18.71 314.16" stroke-dashoffset="-245.25" transform="rotate(-90 105 128)"/><circle cx="105" cy="128" r="50" fill="none" stroke="#3572A5" stroke-width="20" stroke-dasharray="13.66 314.16" stroke-dashoffset="-265.46" transform="rotate(-90 105 128)"/><circle cx="105" cy="128" r="50" fill="none" stroke="#f7523f" stroke-width="20" stroke-dasharray="12.65 314.16" stroke-dashoffset="-280.62" transform="rotate(-90 105 128)"/><circle cx="105" cy="128" r="50" fill="none" stroke="#6e7681" stroke-width="20" stroke-dasharray="17.89 314.16" stroke-dashoffset="-294.77" transform="rotate(-90 105 128)"/>
